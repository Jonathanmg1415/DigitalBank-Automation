serenity {
    take.screenshots = FOR_EACH_ACTION
    # Cada actor (Ana, Luis, el administrador, el cajero) tiene su propio navegador,
    # y cada escenario empieza con navegadores nuevos: la sesión de uno no afecta al siguiente.
    use.unique.browser = false
    test.root = co.edu.udea.calidad.digitalbank
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

# Formatos de los resultados. "html" genera durante la ejecución la página de detalle de cada
# escenario (pasos y capturas); sin él, el informe enlaza a páginas que no existen.
output.formats = "json,xml,html"

#headless.mode = true

webdriver {
  driver = chrome
  autodownload = true
  # Espera hasta 5 s a que aparezcan los elementos antes de fallar
  timeouts.implicitlywait = 5000
  wait.for.timeout = 10000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

# --window-size fija el tamaño en modo headless (sin él, Chrome usa 800 x 600 y las capturas salen
# recortadas); con el navegador visible manda --start-maximized.
chrome.switches = """--start-maximized;--window-size=1366,900;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars,--disable-gpu;--remote-allow-origins=*"""

# URL del frontend de Digital Bank. Se elige con -Denvironment=<nombre> o se reemplaza con
# -Dwebdriver.base.url=<url>. Las APIs se alcanzan a través del mismo origen (/svc/auth, /svc/core,
# /svc/reportes), así que no hace falta configurar sus direcciones aparte.
environments {
  default {
    webdriver.base.url = "http://localhost:5173"
  }
  local {
    webdriver.base.url = "http://localhost:5173"
  }
  vercel {
    webdriver.base.url = "https://digital-bank-frontend-nu.vercel.app"
  }
}

# Segundos máximos que se espera la respuesta del backend. Render apaga las APIs sin uso
# y la primera petición puede tardar varios minutos.
digitalbank.respuesta.timeout = 90
